name: check

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: offline suite
        run: make check
      - name: dry run the four scenarios
        run: python3 scripts/dry_run.py
